<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Ôn Tập - mcdblowsurmind for haidang</title>
    <style>
        :root {
            --primary-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-main: #333;
            --correct: #2ecc71;
            --wrong: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-bg);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: white;
        }

        .container { max-width: 900px; margin: 0 auto; }

        /* Header & Dashboard */
        header { text-align: center; margin-bottom: 30px; }
        .dashboard {
            background: var(--card-bg);
            color: var(--text-main);
            display: flex;
            justify-content: space-around;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 25px;
        }
        .stat-item { text-align: center; }
        .stat-value { display: block; font-size: 24px; font-weight: bold; color: #5e35b1; }

        /* Quiz Section */
        .quiz-card {
            background: var(--card-bg);
            color: var(--text-main);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.3s;
        }

        .option-btn:hover { border-color: #764ba2; background: #f8f9ff; }

        /* Logic Colors */
        .correct { background-color: #d4edda !important; border-color: var(--correct) !important; color: #155724; }
        .wrong { background-color: #f8d7da !important; border-color: var(--wrong) !important; color: #721c24; }
        
        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💻 mcdblowsurmind for haidang</h1>
        <p>Hệ thống ôn tập câu hỏi theo chương</p>
    </header>

    <div class="dashboard">
        <div class="stat-item">
            <span class="stat-label">Tổng câu hỏi</span>
            <span id="total-qs" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Đã hoàn thành</span>
            <span id="completed-qs" class="stat-value">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Tỷ lệ chính xác</span>
            <span id="accuracy" class="stat-value">0%</span>
        </div>
    </div>

    <!-- bulk import và form thêm câu hỏi mới -->
    <div class="quiz-card" id="bulk-card">
        <h2>📄 Nhập hàng loạt</h2>
        <p>Định dạng mỗi mục:</p>
        <pre style="background:#f1f1f1; padding:8px; border-radius:5px; color:#000;">
câu 1: Đây là câu hỏi?
A. Lựa chọn 1
B. Lựa chọn 2
C. Lựa chọn 3
D. Lựa chọn 4
Answer: B
</pre>
        <textarea id="bulk-input" rows="8" style="width:100%; padding:8px;"></textarea>
        <button id="bulk-submit" style="margin-top:10px; padding:10px 20px; font-size:16px;">Nhập</button>
    </div>

    <div class="quiz-card" id="add-card">
        <h2>➕ Thêm câu hỏi mới</h2>
        <form id="question-form">
            <div style="margin-bottom:10px;">
                <label for="new-q">Câu hỏi:</label><br>
                <input type="text" id="new-q" required style="width:100%; padding:8px;" />
            </div>
            <div id="options-inputs">
                <div style="margin-bottom:8px;">
                    <label>Đáp án 1:</label>
                    <input type="text" class="opt-input" required style="width:70%; padding:6px;" />
                    <input type="radio" name="correct" value="0" required> đúng
                </div>
                <div style="margin-bottom:8px;">
                    <label>Đáp án 2:</label>
                    <input type="text" class="opt-input" required style="width:70%; padding:6px;" />
                    <input type="radio" name="correct" value="1"> đúng
                </div>
                <div style="margin-bottom:8px;">
                    <label>Đáp án 3:</label>
                    <input type="text" class="opt-input" required style="width:70%; padding:6px;" />
                    <input type="radio" name="correct" value="2"> đúng
                </div>
                <div style="margin-bottom:8px;">
                    <label>Đáp án 4:</label>
                    <input type="text" class="opt-input" required style="width:70%; padding:6px;" />
                    <input type="radio" name="correct" value="3"> đúng
                </div>
            </div>
            <button type="submit" style="padding:10px 20px; font-size:16px;">Thêm</button>
        </form>
    </div>

    <div id="quiz-content">
        </div>
</div>

<script>
    // 1. DỮ LIỆU CÂU HỎI (Bạn có thể thêm bao nhiêu tùy thích)
    // start with no predefined questions; user will add via form
    let questions = []; // use let since we may overwrite from URL data

    let completed = 0;
    let correctCount = 0;

    // 2. LOGIC HIỂN THỊ
    function renderQuestion(item, index) {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <p><strong>Câu ${index + 1}:</strong> ${item.q}</p>
                <button onclick="enterEditMode(${index})" style="font-size:14px;">✏️ Sửa</button>
            </div>
            <div class="options-group" id="group-${index}">
                ${item.options.map(opt => `
                    <button class="option-btn" onclick="handleCheck(this, '${opt}', '${item.answer}', ${index})">
                        ${opt}
                    </button>
                `).join('')}
            </div>
        `;
        return card;
    }

    function initQuiz() {
        const container = document.getElementById('quiz-content');
        container.innerHTML = '';
        document.getElementById('total-qs').innerText = questions.length;

        questions.forEach((item, index) => {
            container.appendChild(renderQuestion(item, index));
        });
    }

    // load stored questions from URL if present
    function loadFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if (params.has('q')) {
            try {
                const data = decodeURIComponent(params.get('q'));
                const arr = JSON.parse(data);
                if (Array.isArray(arr)) {
                    questions = arr;
                    // keep localStorage in sync
                    saveToStorage();
                }
            } catch (e) {
                console.warn('Không thể phân tích dữ liệu từ URL', e);
            }
        }
    }

    // update the browser URL with current questions
    function saveToUrl() {
        try {
            const data = encodeURIComponent(JSON.stringify(questions));
            const newUrl = window.location.pathname + '?q=' + data;
            window.history.replaceState(null, '', newUrl);
        } catch (e) {
            console.warn('Không thể lưu dữ liệu vào đường link', e);
        }
    }

    // persist questions array into localStorage
    function saveToStorage() {
        try {
            localStorage.setItem('questions', JSON.stringify(questions));
        } catch (e) {
            console.warn('Không thể lưu dữ liệu vào localStorage', e);
        }
    }

    // load questions from localStorage (if any)
    function loadFromStorage() {
        try {
            const data = localStorage.getItem('questions');
            if (data) {
                const arr = JSON.parse(data);
                if (Array.isArray(arr)) {
                    questions = arr;
                }
            }
        } catch (e) {
            console.warn('Không thể đọc dữ liệu từ localStorage', e);
        }
    }

    // edit-related helpers
    function enterEditMode(index) {
        const q = questions[index];
        const card = document.getElementById('quiz-content').children[index];
        card.innerHTML = `
            <div style="margin-bottom:10px;"><strong>Câu ${index+1}:</strong><br>
                <input type=text id="edit-q-${index}" value="${q.q.replace(/"/g,'&quot;')}" style="width:100%;" />
            </div>
            <div id="edit-opts-${index}">
                ${q.options.map((opt,i) => `
                    <div style="margin-bottom:6px;">
                        <label>${String.fromCharCode(65+i)}.</label>
                        <input type="text" id="edit-opt-${index}-${i}" value="${opt.replace(/"/g,'&quot;')}" style="width:70%;" />
                        <input type="radio" name="edit-correct-${index}" value="${i}" ${opt===q.answer?'checked':''}> đúng
                    </div>
                `).join('')}
            </div>
            <button onclick="saveEdit(${index})" style="padding:6px 12px; margin-right:6px;">Lưu</button>
            <button onclick="initQuiz()" style="padding:6px 12px;">Hủy</button>
        `;
    }

    function saveEdit(index) {
        const qText = document.getElementById(`edit-q-${index}`).value.trim();
        const opts = [];
        let i = 0;
        while(true) {
            const el = document.getElementById(`edit-opt-${index}-${i}`);
            if (!el) break;
            opts.push(el.value.trim());
            i++;
        }
        const correctRadio = document.querySelector(`input[name="edit-correct-${index}"]:checked`);
        if (!qText || opts.some(o=>o==='') || !correctRadio) {
            alert('Điền đầy đủ thông tin và chọn đáp án đúng.');
            return;
        }
        const correctIdx = parseInt(correctRadio.value,10);
        // check duplicate against others
        const normalized = qText.trim().toLowerCase();
        if (questions.some((qq,j)=>j!==index && qq.q.trim().toLowerCase()===normalized)) {
            alert('Câu hỏi trùng với một câu khác, không lưu được.');
            return;
        }
        questions[index].q = qText;
        questions[index].options = opts;
        questions[index].answer = opts[correctIdx];
        saveToUrl();
        saveToStorage();
        initQuiz();
    }

    function isDuplicateQuestion(text) {
        const normalized = text.trim().toLowerCase();
        return questions.some(q => q.q.trim().toLowerCase() === normalized);
    }

    function addQuestionToQuiz(qText, opts, correctIdx) {
        if (isDuplicateQuestion(qText)) {
            console.warn('Bỏ qua câu trùng:', qText);
            return false;
        }
        const id = questions.length + 1;
        const answer = opts[correctIdx];
        const newQ = { id, q: qText, options: opts, answer };
        questions.push(newQ);
        saveToUrl();
        saveToStorage();

        const container = document.getElementById('quiz-content');
        container.appendChild(renderQuestion(newQ, questions.length - 1));
        document.getElementById('total-qs').innerText = questions.length;
        return true;
    }

    function handleAddFormSubmit(e) {
        e.preventDefault();
        const qText = document.getElementById('new-q').value.trim();
        const optInputs = document.querySelectorAll('.opt-input');
        const opts = Array.from(optInputs).map(i => i.value.trim());
        const correctRadio = document.querySelector('input[name="correct"]:checked');
        if (!qText || opts.some(o => o === '') || !correctRadio) {
            alert('Vui lòng nhập đầy đủ thông tin và chọn đáp án đúng.');
            return;
        }
        const correctIdx = parseInt(correctRadio.value, 10);
        addQuestionToQuiz(qText, opts, correctIdx);
        e.target.reset();
    }

    document.getElementById('question-form').addEventListener('submit', handleAddFormSubmit);
    document.getElementById('bulk-submit').addEventListener('click', handleBulkSubmit);

    // parse bulk formatted text into array of question objects
    function parseBulkInput(text) {
        const lines = text.split("\n").map(l => l.trim()).filter(l => l !== '');
        const result = [];
        let current = null;
        lines.forEach(line => {
            const qMatch = line.match(/^câu\s*\d+\s*:\s*(.+)/i);
            if (qMatch) {
                if (current) result.push(current);
                current = { q: qMatch[1].trim(), options: [], answer: null };
            } else if (current) {
                const optMatch = line.match(/^([A-Da-d])\s*\.\s*(.+)/);
                if (optMatch) {
                    current.options.push(optMatch[2].trim());
                } else {
                    const ansMatch = line.match(/^answer\s*[:\-]\s*([A-Da-d])/i);
                    if (ansMatch && current.options.length > 0) {
                        const letter = ansMatch[1].toUpperCase();
                        current.answer = current.options[letter.charCodeAt(0) - 65];
                    }
                }
            }
        });
        if (current) result.push(current);
        // drop entries without full data
        return result.filter(q => q.q && q.options.length >= 2 && q.answer);
    }

    function handleBulkSubmit(e) {
        const text = document.getElementById('bulk-input').value;
        const items = parseBulkInput(text);
        if (items.length === 0) {
            alert('Không tìm thấy câu hợp lệ. Hãy kiểm tra định dạng.');
            return;
        }
        items.forEach(it => {
            // determine index of answer in options
            const idx = it.options.indexOf(it.answer);
            const added = addQuestionToQuiz(it.q, it.options, idx >= 0 ? idx : 0);
            if (!added) {
                console.log('Đã bỏ qua câu trùng khi nhập hàng loạt:', it.q);
            }
        });
        document.getElementById('bulk-input').value = '';
        localStorage.removeItem('bulk-input');
    }

    // 3. LOGIC KIỂM TRA ĐÚNG SAI
    function handleCheck(btn, selected, correct, groupIdx) {
        const group = document.getElementById(`group-${groupIdx}`);
        const buttons = group.querySelectorAll('.option-btn');
        buttons.forEach(b => b.style.pointerEvents = 'none');
        completed++;
        if (selected === correct) {
            btn.classList.add('correct');
            correctCount++;
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.innerText.trim() === correct) b.classList.add('correct');
            });
        }
        updateDashboard();
    }

    // 4. CẬP NHẬT DASHBOARD
    function updateDashboard() {
        document.getElementById('completed-qs').innerText = completed;
        const percent = completed > 0 ? Math.round((correctCount / completed) * 100) : 0;
        document.getElementById('accuracy').innerText = percent + "%";
    }

    // Chạy khởi tạo
    loadFromStorage();
    loadFromUrl();
    initQuiz();

    // populate inputs from storage (bulk input + add form)
    const bulkEl = document.getElementById('bulk-input');
    const savedBulk = localStorage.getItem('bulk-input');
    if (savedBulk) bulkEl.value = savedBulk;
    bulkEl.addEventListener('input', e => localStorage.setItem('bulk-input', e.target.value));

    const newQEl = document.getElementById('new-q');
    if (newQEl) {
        const savedNew = localStorage.getItem('new-q');
        if (savedNew) newQEl.value = savedNew;
        newQEl.addEventListener('input', e => localStorage.setItem('new-q', e.target.value));
    }

    document.querySelectorAll('.opt-input').forEach((el, i) => {
        const key = 'opt-input-' + i;
        const val = localStorage.getItem(key);
        if (val) el.value = val;
        el.addEventListener('input', e => localStorage.setItem(key, e.target.value));
    });

    document.querySelectorAll('input[name="correct"]').forEach(r => {
        if (localStorage.getItem('correct-answer') === r.value) r.checked = true;
        r.addEventListener('change', e => {
            localStorage.setItem('correct-answer', e.target.value);
        });
    });

    // clear form storage on submit
    document.getElementById('question-form').addEventListener('submit', () => {
        ['new-q'].forEach(k => localStorage.removeItem(k));
        document.querySelectorAll('.opt-input').forEach((_,i)=> localStorage.removeItem('opt-input-'+i));
        localStorage.removeItem('correct-answer');
    });
</script>

</body>
</html>
